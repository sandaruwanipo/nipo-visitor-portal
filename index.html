import {createRoot} from 'react-dom/client';

  authDomain: "nipo-roster.firebaseapp.com",

function localDateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

// Sri Lanka Public Holidays 2026 - from ExcelNotes

"2026-01-03":"Duruthu Full Moon Poya Day",
"2026-01-15":"Tamil Thai Pongal Day",
"2026-02-01":"Navam Full Moon Poya Day",
"2026-02-04":"Independence Day",
"2026-02-15":"Maha Shivaratri Day",
"2026-03-02":"Medin Full Moon Poya Day",
"2026-03-20":"Eid al-Fitr",
"2026-04-01":"Bak Full Moon Poya Day",
"2026-04-03":"Good Friday",
"2026-04-13":"Sinhala and Tamil New Year's Eve",
"2026-04-14":"Sinhala and Tamil New Year",
"2026-05-01":"Labour Day & Vesak Poya Day",
"2026-05-02":"Vesak Holiday",
"2026-05-27":"Eid al-Adha",
"2026-06-29":"Poson Full Moon Poya Day",
"2026-07-29":"Esala Full Moon Poya Day",
"2026-08-26":"Prophet's Birthday",
"2026-08-27":"Nikini Full Moon Poya Day",
"2026-09-26":"Binara Full Moon Poya Day",
"2026-10-25":"Vap Full Moon Poya Day",
"2026-11-08":"Deepavali Festival Day",
"2026-11-24":"Ill Full Moon Poya Day",
"2026-12-23":"Unduvap Full Moon Poya Day",
"2026-12-25":"Christmas Day"
};

let db=null, fb=null;
async function initFB(){
 try{
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const {getFirestore, doc, setDoc, onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);
  fb={doc,setDoc,onSnapshot};
  return true;
 }catch(e){console.error(e); return false;}
}

const DEFAULT_NI=["THILINA PRABA.","THILINA SANDA.","THUSHARI","UPEKHA","ACHINI","AJITH","IROSHI","ISURI","JAYANTHA","KAVITH","NAYOMI","RAVIMINI"];

function App(){
 const [dark,setDark]=useState(()=>localStorage.getItem('nipo_dark')==='1');
 const [infoPool,setInfoPool]=useState([...DEFAULT_NI]);
 const [lunchPool,setLunchPool]=useState([...DEFAULT_NI]);
 const [newInfoName,setNewInfoName]=useState('');
 const [newLunchName,setNewLunchName]=useState('');
 const [year,setYear]=useState(2026);
 const [month,setMonth]=useState(9);
 const [starters,setStarters]=useState({});
 const [swaps,setSwaps]=useState([]);
 const [lastUpdated,setLastUpdated]=useState(null);
 const [isAdmin,setIsAdmin]=useState(false);
 const [showLogin,setShowLogin]=useState(false);
 const [cred,setCred]=useState({u:'',p:''});
 const [selA,setSelA]=useState('');
 const [selB,setSelB]=useState('');
 const [poolType,setPoolType]=useState('lunch');
 const [filter,setFilter]=useState('ALL');
 const [fbReady,setFbReady]=useState(false);
 const [toast,setToast]=useState(null);
 const [now,setNow]=useState(new Date());
 const [showHolidays,setShowHolidays]=useState(true);
 useEffect(()=>{const i=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(i)},[]);
 useEffect(()=>{document.documentElement.classList.toggle('dark',dark); localStorage.setItem('nipo_dark', dark?'1':'0');},[dark]);

 useEffect(()=>{
  const saved=localStorage.getItem('nipo_beautiful_final');
  if(saved){try{const d=JSON.parse(saved); if(d.infoPool) setInfoPool(d.infoPool); if(d.lunchPool) setLunchPool(d.lunchPool); if(d.swaps) setSwaps(d.swaps); if(d.starters) setStarters(d.starters); if(d.lastUpdated) setLastUpdated(d.lastUpdated);}catch{}}
 },[]);

 useEffect(()=>{
  (async()=>{
   const ok=await initFB();
   if(ok){
    setFbReady(true);
    const r=fb.doc(db,"nipoRoster","live");
    fb.onSnapshot(r,(snap)=>{
     const v=snap.exists()? snap.data(): null;
     if(v){
      if(v.infoPool) setInfoPool(v.infoPool);
      if(v.lunchPool) setLunchPool(v.lunchPool);
      if(v.swaps) setSwaps(v.swaps);
      if(v.starters) setStarters(v.starters);
      if(v.lastUpdated) setLastUpdated(v.lastUpdated);
     }
    });
   }
  })();
 },[]);

 const saveAll=async (o)=>{
  const data={
   infoPool: o.infoPool??infoPool,
   lunchPool: o.lunchPool??lunchPool,
   swaps: o.swaps??swaps,
   starters: o.starters??starters,
   lastUpdated: o.lastUpdated??new Date().toISOString()
  };
  localStorage.setItem('nipo_beautiful_final',JSON.stringify(data));
  if(fbReady && db){ try{ await fb.setDoc(fb.doc(db,"nipoRoster","live"), data, {merge:true});}catch(e){console.error(e);} }
 };

 const monthKey=`${year}-${String(month+1).padStart(2,'0')}`;
 const curStarter=starters[monthKey]||{info:infoPool[0], lunch:lunchPool[0]};
 const getRotated=(pool, starter)=>{
  if(!starter) return pool;
  const idx=pool.indexOf(starter);
  if(idx<=0) return pool;
  return [...pool.slice(idx),...pool.slice(0,idx)];
 };
 const rotInfo=getRotated(infoPool, curStarter.info);
 const rotLunch=getRotated(lunchPool, curStarter.lunch);

 // Build working days excluding weekends AND public holidays
 const allDays=[];
 const d=new Date(year,month,1);
 while(d.getMonth()===month){allDays.push(new Date(d)); d.setDate(d.getDate()+1);}
 
 const holidaysThisMonth = allDays.filter(dt=> HOLIDAYS_2026[localDateStr(dt)]).map(dt=>({date:dt, name:HOLIDAYS_2026[localDateStr(dt)]}));
 const workingDays = allDays.filter(dt=>{
   const wd=dt.getDay();
   if(wd===0||wd===6) return false;
   if(HOLIDAYS_2026[localDateStr(dt)]) return false;
   return true;
 });

 const orig={};
 workingDays.forEach((dt,i)=>{
  const ds=localDateStr(dt);
  orig[ds]={info: rotInfo[i%rotInfo.length], lunch: rotLunch[i%rotLunch.length], date:dt};
 });
 const fin={...Object.fromEntries(Object.entries(orig).map(([k,v])=>[k,{...v}]))};
 const swappedDates=new Set();
 swaps.filter(s=>s.monthKey===monthKey).forEach(s=>{
  swappedDates.add(s.dateA); swappedDates.add(s.dateB);
  if(fin[s.dateA]&&fin[s.dateB]){
   if(s.type==='info'){const t=fin[s.dateA].info; fin[s.dateA].info=fin[s.dateB].info; fin[s.dateB].info=t;}
   else{const t=fin[s.dateA].lunch; fin[s.dateA].lunch=fin[s.dateB].lunch; fin[s.dateB].lunch=t;}
  }
 });
 const detail={};
 swaps.filter(s=>s.monthKey===monthKey).forEach(s=>{
  const addDetail=(ds)=>{
    if(!fin[ds] || !orig[ds]) return;
    if(fin[ds][s.type]===orig[ds][s.type]) return;
    if(!detail[ds]) detail[ds]={};
    detail[ds][s.type]={orig:orig[ds][s.type], curr:fin[ds][s.type]};
  };
  addDetail(s.dateA);
  addDetail(s.dateB);
 });

 const filtered=useMemo(()=>{
  if(filter==='ALL') return workingDays;
  return workingDays.filter(dt=>{
   const ds=localDateStr(dt);
   if(swappedDates.has(ds)) return true;
   const f=fin[ds]; return f && (f.info===filter || f.lunch===filter);
  });
 },[filter,workingDays,fin]);

 const hm=now.getHours()*60+now.getMinutes();
 const infoLive=hm>=8*60+45 && hm<=16*60;
 const lunchLive=hm>=12*60+30 && hm<=13*60;

 const doSwap=()=>{
  if(!selA||!selB||selA===selB){setToast('Select two different dates'); setTimeout(()=>setToast(null),2500); return;}
  const offA=poolType==='info'? fin[selA]?.info : fin[selA]?.lunch;
  const offB=poolType==='info'? fin[selB]?.info : fin[selB]?.lunch;
  if(!offA||!offB){setToast('Dates must be working days (not holiday/weekend)'); setTimeout(()=>setToast(null),2500); return;}
  const newS={id:`${Date.now()}`, dateA:selA, dateB:selB, type:poolType, officerA_before:offA, officerB_before:offB, monthKey, createdAt:new Date().toISOString()};
  const up=[...swaps, newS]; setSwaps(up); saveAll({swaps:up, lastUpdated:new Date().toISOString()}); setSelA(''); setSelB(''); setFilter('ALL'); setToast(`✅ Swapped ${selA.slice(8)} ↔ ${selB.slice(8)} - exact Colombo dates`); setTimeout(()=>setToast(null),3500);
 };

 const removePerson=(type, name)=>{
  if(!isAdmin){setToast('Admin only'); setTimeout(()=>setToast(null),2000); return;}
  if(type==='info'){
   const up=infoPool.filter(n=>n!==name); setInfoPool(up); saveAll({infoPool:up});
  } else {
   const up=lunchPool.filter(n=>n!==name); setLunchPool(up); saveAll({lunchPool:up});
  }
  setToast(`Removed ${name}`); setTimeout(()=>setToast(null),2000);
 };
 const movePerson=(type, idx, dir)=>{
  if(!isAdmin){setToast('Admin only'); setTimeout(()=>setToast(null),2000); return;}
  const pool=type==='info'? [...infoPool] : [...lunchPool];
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=pool.length) return;
  const [moved]=pool.splice(idx,1);
  pool.splice(newIdx,0,moved);
  if(type==='info'){setInfoPool(pool); saveAll({infoPool:pool});} else {setLunchPool(pool); saveAll({lunchPool:pool});}
  setToast(`Moved ${moved} ${dir>0?'down':'up'}`); setTimeout(()=>setToast(null),1500);
 };
 const addPerson=(type)=>{
  if(!isAdmin){setToast('Admin only'); setTimeout(()=>setToast(null),2000); return;}
  const name=(type==='info'? newInfoName: newLunchName).trim().toUpperCase();
  if(!name){setToast('Enter name'); setTimeout(()=>setToast(null),2000); return;}
  if(type==='info'){
   if(infoPool.includes(name)){setToast('Already exists'); return;}
   const up=[...infoPool, name]; setInfoPool(up); saveAll({infoPool:up}); setNewInfoName(''); setToast(`Added ${name} to Info pool`); 
  } else {
   if(lunchPool.includes(name)){setToast('Already exists'); return;}
   const up=[...lunchPool, name]; setLunchPool(up); saveAll({lunchPool:up}); setNewLunchName(''); setToast(`Added ${name} to Lunch pool`);
  }
  setTimeout(()=>setToast(null),2500);
 };


 const months=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

 return React.createElement('div',{className:`min-h-screen bg-[var(--bg)] text-[var(--ink)] ${dark?'dark':''}`, style:{paddingTop:'env(safe-area-inset-top,0px)'}},
  React.createElement('style',{},`
    .bg-ink{ background:var(--bg) }
  `),
  React.createElement('div',{className:`sticky top-0 z-40 border-b backdrop-blur ${fbReady?'bg-emerald-500/95 text-white border-emerald-600':'bg-amber-200 text-[#4a3b00] border-amber-300'}`},
   React.createElement('div',{className:'mx-auto max-w-[1280px] px-4 md:px-6 py-2 flex justify-between items-center text-[12px] font-medium'},
    React.createElement('div',{className:'flex items-center gap-2'},
     React.createElement('span',{className:`h-2 w-2 rounded-full ${fbReady?'bg-white animate-pulse':'bg-amber-700'}`}),
     React.createElement('span',{className:'mono uppercase tracking-widest'}, fbReady? '🔴 LIVE • Colombo Dates Fixed • Public Sync':'LOCAL MODE'),
     React.createElement('span',{className:'hidden md:inline mono text-[11px] opacity-70'}, lastUpdated? `Last: ${new Date(lastUpdated).toLocaleString('en-GB',{timeZone:'Asia/Colombo'})} Colombo`: '')
    ),
    React.createElement('div',{className:'flex gap-2'},
     React.createElement('button',{onClick:()=>setDark(!dark), className:'px-3 py-1 rounded-full bg-black/10 border text-[11px] mono uppercase'}, dark?'☀️ Light':'🌙 Dark'),
     !isAdmin ? React.createElement('button',{onClick:()=>setShowLogin(true), className:'px-3 py-1 bg-[var(--accent)] text-[var(--bg)] mono uppercase text-[11px] font-bold'},'Admin') :
     React.createElement('div',{className:'flex gap-1'},
      React.createElement('button',{onClick:()=>{saveAll({lastUpdated:new Date().toISOString()}); setToast('✅ Saved! Live to all viewers'); setTimeout(()=>setToast(null),2000);}, className:'px-4 py-1 bg-white text-black mono uppercase text-[11px] font-bold rounded'},'Green Update ↗'),
      React.createElement('button',{onClick:()=>setIsAdmin(false), className:'px-3 py-1 border mono text-[11px] uppercase'},'Logout')
     )
    )
   )
  ),
  React.createElement('header',{className:'sticky top-[37px] z-30 bg-[var(--bg)]/90 backdrop-blur border-b border-[var(--border)]'},
   React.createElement('div',{className:'mx-auto max-w-[1280px] px-4 md:px-6 py-4 flex justify-between items-start'},
    React.createElement('div',{className:'flex gap-4'},
     React.createElement('div',{className:'hidden md:flex h-[56px] w-[56px] bg-[var(--accent)] text-[var(--bg)] items-center justify-center text-[22px] font-bold'},'NIPO'),
     React.createElement('div',{},
      React.createElement('h1',{className:'text-[22px] md:text-[28px] font-bold uppercase leading-[0.95]'}, 'NIPO Roster', React.createElement('span',{className:'block text-[11px] font-medium tracking-[0.2em] opacity-60 mt-1'},'Information & Lunch • Colombo Fixed • Holidays Excluded')),
      React.createElement('div',{className:'mt-2 flex flex-wrap gap-2'},
       React.createElement('span',{className:'inline-flex items-center gap-1.5 rounded-full bg-[var(--surface)] border border-[var(--border)] px-2.5 py-1 text-[10px] mono uppercase'}, React.createElement('span',{className:'h-1.5 w-1.5 rounded-full bg-[var(--live-info)] live-blink'}),'08:45–16:00 Information LIVE'),
       React.createElement('span',{className:'inline-flex items-center gap-1.5 rounded-full bg-[var(--surface)] border border-[var(--border)] px-2.5 py-1 text-[10px] mono uppercase'}, React.createElement('span',{className:'h-1.5 w-1.5 rounded-full bg-[var(--live-lunch)] live-blink'}),'12:30–13:00 Lunch LIVE')
      )
     )
    ),
    React.createElement('div',{className:'text-right'},
     React.createElement('div',{className:'mono text-[12px] tracking-widest uppercase opacity-70'}, new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(now)),
     React.createElement('div',{className:'mono text-[15px] font-semibold'}, new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(now)+' Colombo')
    )
   )
  ),
  React.createElement('main',{className:'mx-auto max-w-[1280px] px-4 md:px-6 py-6 grid grid-cols-12 gap-6'},
   React.createElement('div',{className:'col-span-12 lg:col-span-4 space-y-5'},
    React.createElement('div',{className:'bg-[var(--surface)] border border-[var(--border)] p-4'},
     React.createElement('div',{className:'flex justify-between items-center'},
      React.createElement('h3',{className:'mono text-[11px] uppercase tracking-[0.2em] opacity-60'},'Month Control'),
      React.createElement('div',{className:'flex gap-1'},
       React.createElement('button',{onClick:()=>{let m=new Date(year,month-1); setYear(m.getFullYear()); setMonth(m.getMonth());}, className:'h-7 w-7 border grid place-items-center'},'‹'),
       React.createElement('button',{onClick:()=>{let m=new Date(year,month+1); setYear(m.getFullYear()); setMonth(m.getMonth());}, className:'h-7 w-7 border grid place-items-center'},'›')
      )
     ),
     React.createElement('div',{className:'mt-3 text-[32px] font-bold leading-none'}, `${months[month]} ${year}`),
     React.createElement('div',{className:'mt-3 text-[11px] mono opacity-60'}, `${workingDays.length} working days • ${holidaysThisMonth.length} holidays • weekends excluded`),
     React.createElement('div',{className:'mt-4 grid grid-cols-2 gap-2'},
      React.createElement('div',{},
       React.createElement('label',{className:'mono text-[10px] uppercase opacity-60'},'Info Starter'),
       React.createElement('select',{value:curStarter.info, onChange:e=>{const ns={...starters, [monthKey]:{...curStarter, info:e.target.value}}; setStarters(ns); saveAll({starters:ns});}, className:'mt-1 w-full bg-[var(--surface-2)] border border-[var(--border)] px-2 py-2 mono text-[12px]'},
        infoPool.map(o=> React.createElement('option',{key:'info-'+o, value:o},o))
       )
      ),
      React.createElement('div',{},
       React.createElement('label',{className:'mono text-[10px] uppercase opacity-60'},'Lunch Starter'),
       React.createElement('select',{value:curStarter.lunch, onChange:e=>{const ns={...starters, [monthKey]:{...curStarter, lunch:e.target.value}}; setStarters(ns); saveAll({starters:ns});}, className:'mt-1 w-full bg-[var(--surface-2)] border border-[var(--border)] px-2 py-2 mono text-[12px]'},
        lunchPool.map(o=> React.createElement('option',{key:'lunch-'+o, value:o},o))
       )
      )
     ),
     holidaysThisMonth.length>0 && React.createElement('div',{className:'mt-3'},
      React.createElement('div',{className:'flex justify-between items-center'},
       React.createElement('span',{className:'mono text-[10px] uppercase opacity-50'},'Holidays this month'),
       React.createElement('button',{onClick:()=>setShowHolidays(!showHolidays), className:'mono text-[10px] underline'}, showHolidays?'Hide':'Show')
      ),
      showHolidays && React.createElement('div',{className:'mt-2 space-y-1'},
       holidaysThisMonth.map(h=> React.createElement('div',{key:localDateStr(h.date), className:'flex justify-between bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 px-2 py-1 mono text-[10px]'},
        React.createElement('span',{}, localDateStr(h.date).slice(8)+' '+h.date.toLocaleDateString('en-US',{weekday:'short'})),
        React.createElement('span',{className:'font-semibold'}, h.name)
       ))
      )
     )
    ),
    // Pool management
    [
      {label:'Information Pool', type:'info', pool:infoPool, newName:newInfoName, setNewName:setNewInfoName},
      {label:'Lunch Pool', type:'lunch', pool:lunchPool, newName:newLunchName, setNewName:setNewLunchName}
    ].map(cfg=>
      React.createElement('div',{key:cfg.type, className:'bg-[var(--surface)] border border-[var(--border)] p-4'},
       React.createElement('div',{className:'flex justify-between items-center'},
        React.createElement('h4',{className:'mono text-[11px] uppercase tracking-widest opacity-60'}, `${cfg.label} • ${cfg.pool.length}`),
        React.createElement('span',{className:'mono text-[9px] px-2 py-0.5 bg-[var(--surface-2)] border rounded-full'}, 'Add/Remove enabled')
       ),
       React.createElement('div',{className:'mt-3 flex gap-2'},
        React.createElement('input',{value:cfg.newName, onChange:e=>cfg.setNewName(e.target.value), placeholder:'Add person NAME', className:'flex-1 bg-[var(--surface-2)] border border-[var(--border)] px-2 py-2 mono text-[12px] uppercase'}),
        React.createElement('button',{onClick:()=>addPerson(cfg.type), className:'px-4 bg-[var(--accent)] text-[var(--bg)] mono text-[11px] uppercase font-bold'},'Add')
       ),
       React.createElement('div',{className:'mt-3'},
        isAdmin ? React.createElement('div',{className:'flex gap-2 mb-2'},
         React.createElement('input',{value:cfg.newName, onChange:e=>cfg.setNewName(e.target.value), placeholder:'Add person NAME', className:'flex-1 bg-[var(--surface-2)] border border-[var(--border)] px-2 py-2 mono text-[12px] uppercase'}),
         React.createElement('button',{onClick:()=>addPerson(cfg.type), className:'px-4 bg-[var(--accent)] text-[var(--bg)] mono text-[11px] uppercase font-bold'},'Add')
        ) : React.createElement('div',{className:'mono text-[10px] opacity-50 mb-2'},'🔒 Admin only can add/remove/reorder'),
        React.createElement('div',{className:'max-h-[220px] overflow-auto space-y-1 pr-1'},
         cfg.pool.map((name,idx)=>
           React.createElement('div',{key:name, className:'group flex justify-between items-center px-2 py-1.5 border border-transparent hover:border-[var(--border)] hover:bg-[var(--surface-2)]'},
            React.createElement('div',{className:'flex items-center gap-2'},
             React.createElement('span',{className:'mono text-[10px] opacity-40 w-5'}, String(idx+1).padStart(2,'0')),
