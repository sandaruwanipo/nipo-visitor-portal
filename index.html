     }

   }
  })();
 },[]);

   lunchPool: o.lunchPool??lunchPool,
   swaps: o.swaps??swaps,
   starters: o.starters??starters,
   lastUpdated: o.lastUpdated??lastUpdated

  if(fbReady && db){ try{ await fb.setDoc(fb.doc(db,"nipoRoster","live"), data, {merge:true});}catch(e){console.error(e);} }
 };

  if(!starter) return pool;
  const idx=pool.indexOf(starter);
  if(idx<=0) return pool;
  return [...pool.slice(idx),...pool.slice(0,idx)];
 };
 const rotInfo=getRotated(infoPool, curStarter.info);
 const rotLunch=getRotated(lunchPool, curStarter.lunch);

 const days=[];

 while(d.getMonth()===month){const day=d.getDay(); if(day>=1&&day<=5) days.push(new Date(d)); d.setDate(d.getDate()+1);}

 const orig={};
 days.forEach((dt,i)=>{
  const ds=dt.toISOString().split('T')[0];
  orig[ds]={info: rotInfo[i%rotInfo.length], lunch: rotLunch[i%rotLunch.length]};
 });
 const fin={...Object.fromEntries(Object.entries(orig).map(([k,v])=>[k,{...v}]))};

 swaps.filter(s=>s.monthKey===monthKey).forEach(s=>{
  const a=s.dateA, b=s.dateB;
  if(fin[a]&&fin[b]){
   if(s.type==='info'){
    const t=fin[a].info; fin[a].info=fin[b].info; fin[b].info=t;
    detail[a]={orig:orig[a].info, curr:fin[a].info};
    detail[b]={orig:orig[b].info, curr:fin[b].info};
   }else{
    const t=fin[a].lunch; fin[a].lunch=fin[b].lunch; fin[b].lunch=t;
    detail[a]={orig:orig[a].lunch, curr:fin[a].lunch};
    detail[b]={orig:orig[b].lunch, curr:fin[b].lunch};
   }

 });

  const ds=dt.toISOString().split('T')[0];

  const f=fin[ds]; return f && (f.info===filter || f.lunch===filter);
 });

  setSelA(''); setSelB('');
 };
