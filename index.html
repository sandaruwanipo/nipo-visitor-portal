function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}

let db=null, fb=null;
async function initFB(){
 try{
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const {getFirestore, doc, setDoc, onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);
  fb={doc,setDoc,onSnapshot};
  return true;
 }catch(e){console.error(e); return false;}
}

  const saved=localStorage.getItem('nipo_colombo_fixed');
  if(saved){try{const d=JSON.parse(saved); if(d.infoPool) setInfoPool(d.infoPool); if(d.lunchPool) setLunchPool(d.lunchPool); if(d.swaps) setSwaps(d.swaps); if(d.starters) setStarters(d.starters); if(d.lastUpdated) setLastUpdated(d.lastUpdated);}catch{}}
 },[]);

 useEffect(()=>{
  (async()=>{
   const ok=await initFB();
   if(ok){
    setFbReady(true);
    const r=fb.doc(db,"nipoRoster","live");

     const v=snap.exists()? snap.data(): null;
     if(v){

      if(v.lunchPool) setLunchPool(v.lunchPool);
      if(v.swaps) setSwaps(v.swaps);

     }

   }

 },[]);

 };

  if(!starter) return pool;
  const idx=pool.indexOf(starter);
  if(idx<=0) return pool;
  return [...pool.slice(idx),...pool.slice(0,idx)];
 };

 const rotLunch=getRotated(lunchPool, curStarter.lunch);

  const ds=localDateStr(dt);

 });

  const a=s.dateA, b=s.dateB;
  swappedDates.add(a); swappedDates.add(b);
  if(fin[a]&&fin[b]){
   if(s.type==='info'){
    const t=fin[a].info; fin[a].info=fin[b].info; fin[b].info=t;
   }else{
    const t=fin[a].lunch; fin[a].lunch=fin[b].lunch; fin[b].lunch=t;
   }

 });

  }
  if(fin[s.dateB] && orig[s.dateB]){
    if(s.type==='info' && fin[s.dateB].info!==orig[s.dateB].info) detail[s.dateB]= {orig:orig[s.dateB].info, curr:fin[s.dateB].info, type:'info'};

  }
 });

 const filtered=filter==='ALL'? days : days.filter(dt=>{
  const ds=localDateStr(dt);
  if(swappedDates.has(ds)) return true;
  const f=fin[ds]; return f && (f.info===filter || f.lunch===filter);
 });

  const offB=poolType==='info'? fin[selB]?.info : fin[selB]?.lunch;
  const newS={id:`${Date.now()}-${Math.random().toString(36).slice(2,6)}`, dateA:selA, dateB:selB, type:poolType, officerA_before:offA, officerB_before:offB, monthKey, createdAt:new Date().toISOString()};
  const up=[...swaps, newS]; setSwaps(up); saveAll({swaps:up, lastUpdated:new Date().toISOString()}); setSelA(''); setSelB(''); setFilter('ALL'); setToast(`✅ Swapped ${selA.slice(8)} ↔ ${selB.slice(8)} (${poolType}) - Dashboard now shows exact dates`); setTimeout(()=>setToast(null),4000);
 };

 const months=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

 return React.createElement('div',{className:'min-h-screen'},
  React.createElement('div',{className:`sticky top-0 z-40 border-b ${fbReady?'bg-emerald-500 text-white':'bg-amber-200 text-black'} px-4 py-2 flex justify-between mono text-[12px]`},
   React.createElement('span',{}, fbReady? '🔴 LIVE - Colombo dates fixed - Swap will show exact dates':'LOCAL MODE'),
   React.createElement('span',{}, lastUpdated? 'Last: '+new Date(lastUpdated).toLocaleString('en-GB',{timeZone:'Asia/Colombo'}):'')
  ),
  React.createElement('div',{className:'mx-auto max-w-[1280px] p-4 grid grid-cols-12 gap-6'},
   React.createElement('div',{className:'col-span-12 lg:col-span-4 space-y-4'},
    React.createElement('div',{className:'bg-white border p-4'},
     React.createElement('div',{className:'flex justify-between'},
      React.createElement('h3',{className:'mono text-[11px] uppercase opacity-60'},'Month Control'),
      React.createElement('div',{className:'flex gap-1'},
       React.createElement('button',{onClick:()=>{let m=new Date(year,month-1); setYear(m.getFullYear()); setMonth(m.getMonth());}, className:'h-7 w-7 border grid place-items-center'},'‹'),
       React.createElement('button',{onClick:()=>{let m=new Date(year,month+1); setYear(m.getFullYear()); setMonth(m.getMonth());}, className:'h-7 w-7 border grid place-items-center'},'›')
      )
     ),
     React.createElement('div',{className:'mt-2 text-[28px] font-bold'}, `${months[month]} ${year}`),
     React.createElement('div',{className:'mt-3 grid grid-cols-2 gap-2'},
      React.createElement('div',{},
       React.createElement('label',{className:'mono text-[10px] uppercase opacity-60'},'Info Starter'),
       React.createElement('select',{value:curStarter.info, onChange:e=>{const ns={...starters, [monthKey]:{...curStarter, info:e.target.value}}; setStarters(ns); saveAll({starters:ns});}, className:'mt-1 w-full bg-[#efebe4] border px-2 py-2 mono text-[12px]'},
        infoPool.map(o=> React.createElement('option',{key:o, value:o},o))
       )
      ),
      React.createElement('div',{},
       React.createElement('label',{className:'mono text-[10px] uppercase opacity-60'},'Lunch Starter'),
       React.createElement('select',{value:curStarter.lunch, onChange:e=>{const ns={...starters, [monthKey]:{...curStarter, lunch:e.target.value}}; setStarters(ns); saveAll({starters:ns});}, className:'mt-1 w-full bg-[#efebe4] border px-2 py-2 mono text-[12px]'},
        lunchPool.map(o=> React.createElement('option',{key:o, value:o},o))
       )
      )
     )
    ),
    React.createElement('div',{className:'bg-[#0f2a1f] text-white p-4'},
     React.createElement('h3',{className:'mono text-[12px] uppercase'},'Single Nearest Swap ONLY - COLOMBO FIX'),
     React.createElement('p',{className:'mono text-[10px] opacity-70 mt-1'},'Now uses Colombo dates. What you select = what dashboard shows.'),
     React.createElement('div',{className:'mt-4 grid grid-cols-2 gap-2'},
      React.createElement('div',{},
       React.createElement('label',{className:'mono text-[10px] uppercase opacity-70'},'Date A'),
       React.createElement('select',{value:selA, onChange:e=>setSelA(e.target.value), className:'mt-1 w-full bg-white/10 border border-white/20 px-2 py-2 mono text-[12px] text-white'},
        React.createElement('option',{value:'',className:'text-black'},'Select'),
        days.map(dt=>{const ds=localDateStr(dt); return React.createElement('option',{key:ds, value:ds, className:'text-black'}, `${ds} • ${fin[ds]?.info||''} / ${fin[ds]?.lunch||''}`);})
       )
      ),
      React.createElement('div',{},
       React.createElement('label',{className:'mono text-[10px] uppercase opacity-70'},'Date B'),
       React.createElement('select',{value:selB, onChange:e=>setSelB(e.target.value), className:'mt-1 w-full bg-white/10 border border-white/20 px-2 py-2 mono text-[12px] text-white'},
        React.createElement('option',{value:'',className:'text-black'},'Select'),
        days.map(dt=>{const ds=localDateStr(dt); return React.createElement('option',{key:ds, value:ds, className:'text-black'}, `${ds} • ${fin[ds]?.info||''} / ${fin[ds]?.lunch||''}`);})
       )
      )
     ),
     React.createElement('div',{className:'mt-2 flex gap-2'},
      ['info','lunch'].map(t=> React.createElement('button',{key:t, onClick:()=>setPoolType(t), className:`flex-1 py-2 mono text-[11px] uppercase border ${poolType===t?'bg-white text-black border-white':'border-white/30 text-white/70'}`},t))
     ),
     React.createElement('button',{onClick:doSwap, className:'mt-3 w-full bg-white text-black py-2.5 mono text-[12px] uppercase font-bold'},'Create Single Swap'),
     swaps.length>0 && React.createElement('div',{className:'mt-3 border-t border-white/15 pt-2 space-y-1 max-h-[120px] overflow-auto'},
      React.createElement('div',{className:'flex justify-between mono text-[10px] uppercase opacity-60'},
       React.createElement('span',{},`${swaps.filter(s=>s.monthKey===monthKey).length} active swaps`),
       React.createElement('button',{onClick:()=>{const up=[]; setSwaps(up); saveAll({swaps:up});}, className:'underline'},'Clear all')
      ),
      swaps.filter(s=>s.monthKey===monthKey).map(s=> React.createElement('div',{key:s.id, className:'flex justify-between items-center bg-white/10 px-2 py-1 mono text-[10px]'},
       React.createElement('span',{},`${s.dateA.slice(8)} ↔ ${s.dateB.slice(8)} ${s.type} ${s.officerA_before} ↔ ${s.officerB_before}`),
       React.createElement('button',{onClick:()=>{const up=swaps.filter(x=>x.id!==s.id); setSwaps(up); saveAll({swaps:up});}, className:'opacity-60'},'✕')
      ))
     )
    ),
    !isAdmin ? React.createElement('button',{onClick:()=>setShowLogin(true), className:'w-full bg-[#0f2a1f] text-white py-2 mono text-[12px] uppercase'},'Admin Login') :
    React.createElement('div',{className:'flex gap-2'},
     React.createElement('button',{onClick:()=>{saveAll({lastUpdated:new Date().toISOString()}); setToast('Saved! Live sync'); setTimeout(()=>setToast(null),2000);}, className:'flex-1 bg-[#0f2a1f] text-white py-2 mono text-[12px] uppercase'},'Update Live'),
     React.createElement('button',{onClick:()=>setIsAdmin(false), className:'px-4 border mono text-[11px] uppercase'},'Logout')
    )
   ),
   React.createElement('div',{className:'col-span-12 lg:col-span-8'},
    React.createElement('div',{className:'bg-white border overflow-hidden'},
     React.createElement('div',{className:'flex justify-between items-center px-4 py-4 border-b bg-[#efebe4]'},
      React.createElement('h2',{className:'mono text-[13px] uppercase font-semibold'}, `Roster • ${months[month]} ${year} • COLOMBO FIXED`),
      React.createElement('span',{className:'mono text-[11px] opacity-50'}, `${filtered.length} working days`)
     ),
     React.createElement('div',{className:'overflow-auto'},
      React.createElement('table',{className:'w-full border-collapse'},
       React.createElement('thead',{className:'bg-[#efebe4] border-b'},
        React.createElement('tr',{className:'mono text-[11px] uppercase'},
         React.createElement('th',{className:'text-left px-4 py-3'},'Date'),
         React.createElement('th',{className:'text-left px-2 py-3'},'Day'),
         React.createElement('th',{className:'text-left px-4 py-3'},'Information'),
         React.createElement('th',{className:'text-left px-4 py-3'},'Lunch')
        )
       ),
       React.createElement('tbody',{},
        filtered.map(dt=>{
         const ds=localDateStr(dt);
         const f=fin[ds], o=orig[ds];
         const isSwapped=swappedDates.has(ds);
         const today=localDateStr(new Date())===ds;
         return React.createElement('tr',{key:ds, className:`border-b ${today?'bg-amber-50':''} ${isSwapped?'!bg-[#fff7d6]':''}`},
          React.createElement('td',{className:'px-4 py-3 mono text-[13px] font-medium'}, ds.slice(8)+' '+dt.toLocaleDateString('en-GB',{month:'short'})),
          React.createElement('td',{className:'px-2 py-3 mono text-[11px] uppercase'}, dt.toLocaleDateString('en-US',{weekday:'short'})),
          React.createElement('td',{className:`px-4 py-3 relative ${today&&infoLive?'bg-red-50':''}`},
           today&&infoLive && React.createElement('span',{className:'absolute left-0 top-0 bottom-0 w-[3px] bg-[#ff3b30]'}),
           React.createElement('span',{className:'mono text-[13px] font-semibold'}, f?.info||'-'),
           detail[ds] && detail[ds].type==='info' && React.createElement('div',{className:'mt-1 inline-flex bg-amber-100 border border-amber-200 px-2 py-0.5 mono text-[10px]'}, `${f.info} may cover the ${detail[ds].orig} duty`)
          ),
          React.createElement('td',{className:`px-4 py-3 relative ${today&&lunchLive?'bg-orange-50':''}`},
           today&&lunchLive && React.createElement('span',{className:'absolute left-0 top-0 bottom-0 w-[3px] bg-[#ff9500]'}),
           React.createElement('span',{className:'mono text-[13px]'}, f?.lunch||'-'),
           detail[ds] && detail[ds].type==='lunch' && React.createElement('div',{className:'mt-1 inline-flex bg-orange-100 border border-orange-200 px-2 py-0.5 mono text-[10px]'}, `${f.lunch} may cover the ${detail[ds].orig} duty`)
          )
         );
        })
       )
      )
     )
    )
   )
  ),
  showLogin && React.createElement('div',{className:'fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50'},
   React.createElement('div',{className:'bg-white border p-6 w-full max-w-[360px]'},
    React.createElement('h3',{className:'mono text-[14px] uppercase font-semibold'},'Admin Login'),
    React.createElement('input',{value:cred.u, onChange:e=>setCred({...cred, u:e.target.value}), placeholder:'Username', className:'mt-4 w-full bg-[#efebe4] border px-3 py-2 mono text-[13px]'}),
    React.createElement('input',{value:cred.p, onChange:e=>setCred({...cred, p:e.target.value}), type:'password', placeholder:'Password', className:'mt-3 w-full bg-[#efebe4] border px-3 py-2 mono text-[13px]'}),
    React.createElement('div',{className:'mt-4 flex gap-2'},
     React.createElement('button',{onClick:()=>{if(cred.u==='admin' && cred.p==='nipo2026'){setIsAdmin(true); setShowLogin(false); setCred({u:'',p:''});}else{setToast('Invalid'); setTimeout(()=>setToast(null),2000);}}, className:'flex-1 bg-[#0f2a1f] text-white py-2 mono uppercase text-[12px]'},'Login'),
     React.createElement('button',{onClick:()=>setShowLogin(false), className:'px-4 border mono uppercase text-[12px]'},'Cancel')
    )
   )
  ),
  toast && React.createElement('div',{className:'fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#151515] text-white px-4 py-2.5 rounded-full mono text-[12px] z-50'}, toast)
 );
}
createRoot(document.getElementById('root')).render(React.createElement(App));
